name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        # 测试只依赖 requests（llm 层），音频/识别库都是懒加载，CI 不需要装
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff requests

      - name: Lint
        run: ruff check app main.py tests

      - name: Test
        run: pytest tests -q

      - name: Import smoke test
        run: python -c "import app.audio, app.asr, app.assistant, app.store, app.llm, app.config, app.model_fetch; print('ok')"
