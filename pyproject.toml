[project]
name = "meeting-mate"
version = "1.1.0"
description = "桌面语音助理：本地离线转写 + 日报 / 会议纪要"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 115
target-version = "py310"
exclude = [".venv", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = [
  "E501",   # 行宽由 formatter 控制，注释里写清楚比强行折行更重要
  "B008",   # 这里的默认参数都是不可变常量
  "SIM105", # 有些 except 就是为了吞掉，加 contextlib 反而更难读
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
